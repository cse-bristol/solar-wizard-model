name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Nix
      uses: cachix/install-nix-action@v31.11.1
      with:
        # Match the nixpkgs pinned in 320-albion-models/shell.nix.
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/b18a4b9.tar.gz
    
    - name: Setup Nix environment
      run: |
        nix-shell --run "echo 'Nix environment ready'"

    - name: Run tests
      run: |
        nix-shell --run "python3 -m unittest discover -s . -p 'test_*.py' -v"
